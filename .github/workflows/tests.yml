name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '11'
            illuminate: '^11.0'
            testbench: '^9.0'
            phpunit: '^11.5'
          - php: '8.3'
            laravel: '11'
            illuminate: '^11.0'
            testbench: '^9.0'
            phpunit: '^11.5'
          - php: '8.4'
            laravel: '11'
            illuminate: '^11.0'
            testbench: '^9.0'
            phpunit: '^11.5'
          - php: '8.2'
            laravel: '12'
            illuminate: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.3'
            laravel: '12'
            illuminate: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.4'
            laravel: '12'
            illuminate: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.3'
            laravel: '13'
            illuminate: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'
          - php: '8.4'
            laravel: '13'
            illuminate: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      # Every Laravel 11 release now carries unpatched security advisories, which
      # Composer 2.9+ refuses to install by default.
      - name: Allow Laravel 11 despite security advisories
        if: matrix.laravel == '11'
        run: composer config policy.advisories.block false

      - name: Install Composer dependencies
        run: |
          composer require --no-update --no-interaction \
            "illuminate/support:${{ matrix.illuminate }}" \
            "illuminate/contracts:${{ matrix.illuminate }}"
          composer require --dev --no-update --no-interaction \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}"
          composer update -W --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: composer test
